name: Teaching repository checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_repository.py
      - run: node --test tests/mobile_models.test.cjs
      - run: node --test tests/mobile_offline.test.cjs
      - run: python scripts/check_mobile.py
      - run: |
          python scripts/build_course.py
          python scripts/build_mobile.py
          git diff --exit-code
